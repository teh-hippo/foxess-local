[project]
name = "foxess-local"
version = "0.1.0"
description = "Local interception and decoding of FoxESS solar inverter data"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
foxess-relay = "foxess_local.relay:main"
foxess-decode = "foxess_local.decode:main"
foxess-live = "foxess_local.live:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foxess_local"]
