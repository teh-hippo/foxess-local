name: Dependabot Auto-Merge

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: dependabot-automerge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automerge:
    name: Auto-Merge
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    timeout-minutes: 30
    steps:
      - name: Approve PR
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks then merge
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUM: ${{ github.event.pull_request.number }}
          INITIAL_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail

          for attempt in $(seq 1 3); do
            if merge_error=$(gh pr merge --auto --rebase "$PR_URL" 2>&1); then
              echo "::notice::Native auto-merge enabled (branch protection in effect)"
              exit 0
            fi
            if [[ "$merge_error" == *"Base branch was modified"* ]]; then
              if [ "$attempt" -lt 3 ]; then
                echo "::notice::Base branch was modified while enabling auto-merge; retrying ($attempt/3)"
                sleep 5
                continue
              fi
            else
              printf "%s\n" "$merge_error" >&2
              exit 1
            fi
            printf "%s\n" "$merge_error" >&2
            exit 1
          done
          echo "::notice::No branch protection - polling check status"

          total=0
          completed=0
          for i in $(seq 1 60); do
            data=$(gh api "repos/$REPO/commits/$INITIAL_SHA/check-runs?per_page=100")
            counts=$(echo "$data" | jq --arg run_id "$RUN_ID" '
              [.check_runs[] | select((.details_url // "") | contains($run_id) | not)] |
              {total: length,
               completed: ([.[] | select(.status == "completed")] | length),
               failed: ([.[] | select(.status == "completed" and (.conclusion != "success" and .conclusion != "neutral" and .conclusion != "skipped"))] | length)}')
            total=$(echo "$counts" | jq -r .total)
            completed=$(echo "$counts" | jq -r .completed)
            failed=$(echo "$counts" | jq -r .failed)
            echo "[$i/60] checks: $completed/$total completed, $failed failed"
            if [ "$failed" -gt 0 ]; then
              echo "::error::CI checks failed; not merging"
              exit 1
            fi
            if [ "$total" -gt 0 ] && [ "$completed" = "$total" ]; then
              echo "::notice::All checks complete"
              break
            fi
            sleep 30
          done

          current_sha=$(gh api "repos/$REPO/pulls/$PR_NUM" --jq '.head.sha')
          if [ "$current_sha" != "$INITIAL_SHA" ]; then
            echo "::error::PR head SHA changed during polling ($INITIAL_SHA -> $current_sha); aborting (a fresh run will retry)"
            exit 1
          fi

          if [ "$total" = "0" ]; then
            echo "::notice::No checks gating this repo; merging directly"
          else
            echo "::notice::All checks green; merging"
          fi
          gh pr merge --rebase --delete-branch "$PR_URL"
